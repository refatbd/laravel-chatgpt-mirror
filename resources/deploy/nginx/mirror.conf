# ==============================================================================
# Laravel ChatGPT Mirror — Nginx Server Block Snippet
# Supports unbuffered SSE streaming, PHP-FPM, Redis-backed concurrency, and
# ChatGPT CDN/encoded-slash proxying cleanly.
# ==============================================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name YOUR_DOMAIN.COM;
    root /var/www/YOUR_APP/public;
    index index.php;

    client_max_body_size 50M;

    # Allow encoded slashes (%2F) to pass cleanly to Laravel
    merge_slashes off;

    # Disable buffering & increase timeouts on OpenAI / Mirror SSE streaming endpoints
    location ~ ^/(v1|api/chat|backend-api|__codex-api)/ {
        gzip off;
        proxy_buffering off;
        fastcgi_buffering off;
        chunked_transfer_encoding on;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_buffering off;
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;
        }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
    }
}
