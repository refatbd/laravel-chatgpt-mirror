# ==============================================================================
# Webuzo Panel — Custom Apache VirtualHost Include Template
# In Webuzo Enduser / Admin Panel:
#   Apache -> Extra Configuration / Custom VirtualHost Include
# Replace YOUR_DOMAIN.COM, USERNAME, and PHP-FPM socket/port as configured.
# ==============================================================================

# Allow ChatGPT CDN/conversation URLs containing %2F without Apache returning 404
AllowEncodedSlashes NoDecode

# Keep long reasoning / o1 / GPT-5 SSE streams open past Apache's default 60s timeout
Timeout 300
ProxyTimeout 300

# Forward Bearer API keys to PHP-FPM / FastCGI cleanly
<IfModule mod_proxy_fcgi.c>
    CGIPassAuth On
</IfModule>

<IfModule mod_setenvif.c>
    SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1
</IfModule>

# Disable compression on SSE streaming endpoints so tokens stream live without buffering
<LocationMatch "^/(v1|api/chat|backend-api|__codex-api)/">
    SetEnv no-gzip 1
    SetEnv no-brotli 1
    SetEnv dont-vary 1
    <IfModule mod_headers.c>
        Header always set X-Accel-Buffering "no"
    </IfModule>
</LocationMatch>

# Ensure Laravel public directory honors .htaccess
<Directory "/home/USERNAME/public_html/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
